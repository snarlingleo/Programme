<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4b4bf9">
<title>Training — Page introuvable</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#09092d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 30%,rgba(75,75,249,0.12) 0%,transparent 60%);pointer-events:none;}
.container{position:relative;z-index:1;max-width:400px;width:100%;}
.code{font-size:6rem;font-weight:900;color:#4b4bf9;line-height:1;text-shadow:0 0 60px rgba(75,75,249,0.5);animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.emoji{font-size:3rem;margin:1rem 0;}
h1{font-size:1.4rem;font-weight:800;margin-bottom:0.75rem;}
p{font-size:0.85rem;color:#bfa1ff;line-height:1.7;margin-bottom:2rem;}
.btn{display:inline-flex;align-items:center;gap:0.5rem;background:#4b4bf9;color:white;padding:0.85rem 1.75rem;border-radius:14px;text-decoration:none;font-weight:700;font-size:0.9rem;box-shadow:0 4px 20px rgba(75,75,249,0.4);margin-bottom:0.5rem;}
.btn-sec{background:transparent;border:1px solid rgba(191,161,255,0.3);color:#bfa1ff;}
.powered{font-size:0.6rem;color:rgba(255,255,255,0.2);margin-top:2rem;}
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <div class="emoji">🏋️</div>
  <h1>Page introuvable !</h1>
  <p>Cette page n'existe pas.<br>Mais ton programme, lui, t'attend ! 💪</p>
  <div style="display:flex;flex-direction:column;gap:0.5rem">
    <a href="/Programme/" class="btn">↩ Retour à l'app</a>
    <a href="/Programme/" class="btn btn-sec">📅 Mon planning</a>
  </div>
  <div class="powered">Othmane EL-KAHLOUNI</div>
</div>
</body>
</html>
